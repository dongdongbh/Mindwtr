services:
  # The sync server + REST API. This is the only service the native desktop and
  # mobile apps need; point Settings -> Sync -> Self-Hosted at this service.
  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest
    build:
      context: ..
      dockerfile: docker/cloud/Dockerfile
    container_name: mindwtr-cloud
    hostname: mindwtr-cloud
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      # Released images predate /ready (404 -> fall back to liveness); on newer
      # images a real /ready failure (503) still reads unhealthy. (#1127)
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ready); [ \"$$code\" = 200 ] || { [ \"$$code\" = 404 ] && curl -fsS http://localhost:8787/health >/dev/null; }"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - 8787:8787
    environment:
      # One or more access tokens, comma-separated (each 20-512 characters).
      # Each distinct token gets its own private dataset on this server, so
      # several people can share one instance without seeing each other's data.
      # Devices that should sync together must use the same token.
      #   one person, all devices:    MINDWTR_CLOUD_AUTH_TOKENS=alices-long-random-token
      #   several people, one server: MINDWTR_CLOUD_AUTH_TOKENS=alices-long-random-token,bobs-long-random-token
      # Leave this empty only when using docker/compose.secrets.yaml.
      - MINDWTR_CLOUD_AUTH_TOKENS=${MINDWTR_CLOUD_AUTH_TOKENS:-}
      - MINDWTR_CLOUD_CORS_ORIGIN=${MINDWTR_CLOUD_CORS_ORIGIN:?MINDWTR_CLOUD_CORS_ORIGIN must be set}
    volumes:
      - ./data:/app/cloud_data

  # OPTIONAL: the browser/PWA build of the app, served by Nginx. Only needed if
  # you want to open Mindwtr in a web browser. If you only use the native
  # desktop/mobile apps, you can delete this service (and skip its reverse-proxy
  # domain) - mindwtr-cloud alone is a complete sync setup.
  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:latest
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: mindwtr-app
    hostname: mindwtr-app
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    # Preseed the sync setup for fresh browsers so users only enter their token.
    # Optional: when the app and cloud share one domain (compose.https.yaml),
    # the app detects the cloud on its own origin without this.
    # environment:
    #   MINDWTR_DEFAULT_CLOUD_URL: "https://mindwtr.example.com"
    #   MINDWTR_REQUIRE_SYNC: "1"  # forces a login screen (Self-Hosted URL + Access Token) before the app loads
    # NOTE: MINDWTR_REQUIRE_SYNC is a convenience gate to make sure sync is
    # configured, not real authentication: it runs client-side and fails open.
    # Put a reverse proxy in front if you need actual access control.
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    ports:
      - 5173:5173
