services:


  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest
    build:
      context: ..
      dockerfile: docker/cloud/Dockerfile
    container_name: mindwtr-cloud
    hostname: mindwtr-cloud
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    ports:
      - 8787:8787
    environment:


      - MINDWTR_CLOUD_AUTH_TOKENS=${MINDWTR_CLOUD_AUTH_TOKENS:-}
      - MINDWTR_CLOUD_CORS_ORIGIN=${MINDWTR_CLOUD_CORS_ORIGIN:?MINDWTR_CLOUD_CORS_ORIGIN must be set}


      - MINDWTR_CLOUD_MAX_DATA_BODY_BYTES
    volumes:
      - ./data:/app/cloud_data


  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:latest
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: mindwtr-app
    hostname: mindwtr-app
    restart: always
    cpus: "1.0"
    mem_limit: 512m


    environment:


      - MINDWTR_PWA_ENABLED=${MINDWTR_PWA_ENABLED:-true}
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    ports:
      - 5173:5173
