services:
  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest
    build:
      context: ..
      dockerfile: docker/cloud/Dockerfile
    container_name: mindwtr-cloud
    hostname: mindwtr-cloud
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    expose:
      - "8787"
    environment:
      # One or more access tokens, comma-separated; each distinct token gets its
      # own private dataset (see docker/compose.yaml for examples).
      # Leave this empty only when using docker/compose.secrets.yaml.
      - MINDWTR_CLOUD_AUTH_TOKENS=${MINDWTR_CLOUD_AUTH_TOKENS:-}
      - MINDWTR_CLOUD_CORS_ORIGIN=${MINDWTR_CLOUD_CORS_ORIGIN:?MINDWTR_CLOUD_CORS_ORIGIN must be set}
      - MINDWTR_CLOUD_MAX_BODY_BYTES=${MINDWTR_CLOUD_MAX_BODY_BYTES:-2000000}
      # Sync document limit; passed only when set (default 50000000, or
      # MAX_BODY_BYTES when that is larger).
      - MINDWTR_CLOUD_MAX_DATA_BODY_BYTES
      - MINDWTR_CLOUD_MAX_ATTACHMENT_BYTES=${MINDWTR_CLOUD_MAX_ATTACHMENT_BYTES:-50000000}
    volumes:
      - ./data:/app/cloud_data

  caddy:
    image: caddy:2-alpine
    container_name: mindwtr-caddy
    hostname: mindwtr-caddy
    restart: always
    cpus: "0.5"
    mem_limit: 256m
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    ports:
      - "${MINDWTR_HTTP_PORT:-80}:80"
      - "${MINDWTR_HTTPS_PORT:-443}:443"
      - "${MINDWTR_HTTPS_PORT:-443}:443/udp"
    environment:
      - MINDWTR_CLOUD_DOMAIN=${MINDWTR_CLOUD_DOMAIN:?MINDWTR_CLOUD_DOMAIN must be set}
    volumes:
      - ./${MINDWTR_CADDYFILE:-Caddyfile.https}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
