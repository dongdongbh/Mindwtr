services:
  mindwtr-cloud:


    user: "0:0"
    environment:
      MINDWTR_CLOUD_AUTH_TOKENS_FILE: /run/secrets/mindwtr_cloud_tokens
    secrets:
      - source: mindwtr_cloud_tokens
        target: mindwtr_cloud_tokens

secrets:
  mindwtr_cloud_tokens:
    file: ${MINDWTR_CLOUD_AUTH_TOKENS_FILE_HOST:?MINDWTR_CLOUD_AUTH_TOKENS_FILE_HOST must name the host token file}
