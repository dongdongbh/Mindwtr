name: Release Android

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.3)'
        required: false
        type: string
      play_track:
        description: 'Google Play track(s) to publish with the standard AAB. Use production for stable, internal,beta for RCs, or none to skip Play upload.'
        required: false
        default: 'production'
        type: string
      version_code:
        description: 'Resolved Android versionCode to apply before building. If omitted, this workflow resolves one from Google Play.'
        required: false
        default: ''
        type: string
      internal_test_release:
        description: 'Compatibility mode: publish the standard AAB only to the Google Play internal track'
        required: false
        default: false
        type: boolean
      rollout_mode:
        description: 'Stable production rollout mode: staged or immediate'
        required: false
        default: 'staged'
        type: string
      rollout_percentage:
        description: 'Initial stable production rollout percentage when rollout_mode is staged'
        required: false
        default: 5
        type: number
      release_notes:
        description: 'Testing-track release notes'
        required: false
        default: 'Diagnostic build with lightweight sync timing logs.'
        type: string
      retention_days:
        description: 'Internal artifact retention in days'
        required: false
        default: '14'
        type: string
    outputs:
      version_code:
        description: Resolved Android versionCode used by release builds
        value: ${{ jobs.preflight.outputs.version_code }}
      local_version_code:
        description: Android versionCode from apps/mobile/app.json before CI override
        value: ${{ jobs.preflight.outputs.local_version_code }}
      remote_max_version_code:
        description: Highest versionCode found in Google Play tracks during preflight
        value: ${{ jobs.preflight.outputs.remote_max_version_code }}
      internal_version_code:
        description: Compatibility output equal to version_code when the internal track is selected
        value: ${{ jobs.preflight.outputs.internal_version_code }}
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.3)'
        required: false
        type: string
      play_track:
        description: 'Google Play track(s) to publish with the standard AAB. Use production for stable, internal,beta for RCs, or none to skip Play upload.'
        required: false
        default: 'production'
        type: string
      version_code:
        description: 'Resolved Android versionCode to apply before building. If omitted, this workflow resolves one from Google Play.'
        required: false
        default: ''
        type: string
      internal_test_release:
        description: 'Compatibility mode: publish the standard AAB only to the Google Play internal track'
        required: true
        default: false
        type: boolean
      rollout_mode:
        description: 'Stable production rollout mode: staged or immediate'
        required: false
        default: 'staged'
        type: string
      rollout_percentage:
        description: 'Initial stable production rollout percentage when rollout_mode is staged'
        required: false
        default: 5
        type: number
      release_notes:
        description: 'Testing-track release notes'
        required: false
        default: 'Diagnostic build with lightweight sync timing logs.'
        type: string
      retention_days:
        description: 'Internal artifact retention in days'
        required: false
        default: '14'
        type: string

permissions:
  actions: read
  contents: read

env:
  MINDWTR_GMAIL_PRODUCTION_VERIFIED: ${{ vars.MINDWTR_GMAIL_PRODUCTION_VERIFIED }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-android-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    name: Android Release Preflight
    timeout-minutes: 10
    concurrency:
      # Even a version lookup opens an edit and can invalidate another edit.
      group: google-play-production
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.provided_version_code.outputs.resolved_code || steps.version_code.outputs.resolved_code || steps.version_code.outputs.local_code }}
      local_version_code: ${{ steps.provided_version_code.outputs.local_code || steps.version_code.outputs.local_code }}
      remote_max_version_code: ${{ steps.version_code.outputs.remote_max_code }}
      play_tracks: ${{ steps.publish_plan.outputs.play_tracks }}
      has_internal: ${{ steps.publish_plan.outputs.has_internal }}
      publishes_production: ${{ steps.publish_plan.outputs.publishes_production }}
      stable_production_tag: ${{ steps.publish_plan.outputs.stable_production_tag }}
      rollout_mode: ${{ steps.publish_plan.outputs.rollout_mode }}
      rollout_percentage: ${{ steps.publish_plan.outputs.rollout_percentage }}
      internal_version_code: ${{ steps.internal_version_code.outputs.version_code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          INPUT_TAG="${{ inputs.tag || github.event.inputs.tag }}"
          GITHUB_EVENT_INPUTS_TAG="${{ github.event.inputs.tag }}"
          scripts/ci/resolve-release-version.sh "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve Android publish plan
        id: publish_plan
        env:
          PLAY_TRACKS: ${{ inputs.play_track }}
          INTERNAL_TEST_RELEASE: ${{ inputs.internal_test_release && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          RESOLVED_TAG: ${{ steps.version.outputs.tag }}
          ROLLOUT_MODE: ${{ inputs.rollout_mode }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          set -euo pipefail
          stable_production_tag=false
          if [[ "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag_commit=$(git rev-list -n 1 "$RESOLVED_TAG" 2>/dev/null || true)
            checkout_commit=$(git rev-parse HEAD)
            if [ -n "$tag_commit" ] && [ "$tag_commit" = "$checkout_commit" ]; then
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                stable_production_tag=true
              elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]] && [ "$REF_NAME" = "$RESOLVED_TAG" ]; then
                stable_production_tag=true
              fi
            fi
          fi
          python3 scripts/ci/android-play-release-plan.py resolve-tracks \
            --play-tracks "${PLAY_TRACKS:-production}" \
            --internal-test-release "$INTERNAL_TEST_RELEASE" \
            --stable-production-tag "$stable_production_tag" \
            --rollout-mode "${ROLLOUT_MODE:-staged}" \
            --rollout-percentage "${ROLLOUT_PERCENTAGE:-5}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Authenticate Google Play API
        if: ${{ inputs.version_code == '' && steps.publish_plan.outputs.play_tracks != 'none' }}
        id: play_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Use provided Android versionCode
        if: ${{ inputs.version_code != '' }}
        id: provided_version_code
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
          ALLOW_UNTRACKED_VERSION_CODE: ${{ (contains(inputs.tag || github.event.inputs.tag || github.ref_name, '-') || inputs.internal_test_release || inputs.play_track != 'production') && 'true' || 'false' }}
        run: node scripts/ci/android-version-code-policy.js

      - name: Ensure Android versionCode is unique
        if: ${{ inputs.version_code == '' && steps.publish_plan.outputs.play_tracks != 'none' }}
        id: version_code
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          PACKAGE="tech.dongdongbh.mindwtr"
          RESULT_FILE=$(mktemp)
          python3 scripts/ci/google-play-edit.py max-version-code \
            --package "$PACKAGE" \
            --result "$RESULT_FILE"
          MAX_CODE=$(jq -er '.maxVersionCode | numbers' "$RESULT_FILE")
          LOCAL_CODE=$(jq -r '.expo.android.versionCode' apps/mobile/app.json)
          if [ -z "$LOCAL_CODE" ] || [ "$LOCAL_CODE" = "null" ]; then
            echo "Missing expo.android.versionCode in apps/mobile/app.json" >&2
            exit 1
          fi
          REMOTE_MAX_VERSION_CODE="$MAX_CODE" \
            ALLOW_UNTRACKED_VERSION_CODE=${{ (contains(inputs.tag || github.event.inputs.tag || github.ref_name, '-') || inputs.internal_test_release || inputs.play_track != 'production') && 'true' || 'false' }} \
            node scripts/ci/android-version-code-policy.js

      - name: Resolve compatibility internal versionCode
        if: ${{ steps.publish_plan.outputs.has_internal == 'true' }}
        id: internal_version_code
        env:
          RELEASE_VERSION_CODE: ${{ steps.provided_version_code.outputs.resolved_code || steps.version_code.outputs.resolved_code || steps.version_code.outputs.local_code }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION_CODE" ] || [ "$RELEASE_VERSION_CODE" = "null" ]; then
            echo "Missing release Android versionCode" >&2
            exit 1
          fi
          echo "version_code=$RELEASE_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Internal track shares standard versionCode: $RELEASE_VERSION_CODE"

  build-aab:
    needs: preflight
    # Pinned on purpose: this job builds or packages with tools from the runner image,
    # and `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19. Bump CI first, then this.
    runs-on: ubuntu-24.04
    name: Android AAB Build
    timeout-minutes: 75
    env:
      DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY || secrets.DROPBOX_APP_KEY }}
      DONATION_PROMPT_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: bash scripts/ci/setup-android-sdk.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install repository-locked EAS CLI
        run: |
          set -euo pipefail
          npm ci --prefix tools/eas-cli --ignore-scripts --legacy-peer-deps
          tools/eas-cli/node_modules/.bin/eas --version

      - name: Apply resolved Android versionCode
        if: ${{ needs.preflight.outputs.version_code != '' }}
        env:
          REQUESTED_VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          ALLOW_UNTRACKED_VERSION_CODE: ${{ (contains(inputs.tag || github.event.inputs.tag || github.ref_name, '-') || inputs.internal_test_release || inputs.play_track != 'production') && 'true' || 'false' }}
          WRITE_APP_JSON: "1"
        run: node scripts/ci/android-version-code-policy.js

      - name: Build Android AAB (local EAS)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          VERSION=${{ needs.preflight.outputs.version }}
          cd apps/mobile
          OUTPUT="./build/mindwtr-${VERSION}.aab"
          MINDWTR_ANDROID_ARCHS=arm64-v8a,armeabi-v7a "$GITHUB_WORKSPACE/tools/eas-cli/node_modules/.bin/eas" build --platform android --profile production --local --non-interactive --output "$OUTPUT"
          ls -la ./build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANALYTICS_HEARTBEAT_URL: ${{ secrets.ANALYTICS_HEARTBEAT_URL }}
          # Bake the channel: prerelease AABs only ever reach Play testing tracks, stable
          # AABs ship via Play. Runtime install-referrer detection misfiled testers as
          # android-unknown because testing-track installs carry no referrer.
          ANALYTICS_HEARTBEAT_CHANNEL: ${{ contains(inputs.tag || github.event.inputs.tag || github.ref_name, '-') && 'android-internal-test' || 'play-store' }}
          ANALYTICS_RELEASE_VERSION: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          FEEDBACK_ENDPOINT_URL: ${{ vars.FEEDBACK_ENDPOINT_URL || vars.VITE_FEEDBACK_ENDPOINT_URL || 'https://feedback.mindwtr.app' }}

      - name: Verify 16 KB native library alignment
        run: |
          VERSION=${{ needs.preflight.outputs.version }}
          bash scripts/ci/check-android-16kb-page-size.sh "apps/mobile/build/mindwtr-${VERSION}.aab"

      - name: Upload Android AAB build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-aab-build
          path: apps/mobile/build/*.aab
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  build-apk:
    if: ${{ !inputs.internal_test_release }}
    needs: preflight
    # Pinned on purpose: this job builds or packages with tools from the runner image,
    # and `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19. Bump CI first, then this.
    runs-on: ubuntu-24.04
    name: Android APK Build
    timeout-minutes: 75
    env:
      DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY || secrets.DROPBOX_APP_KEY }}
      DONATION_PROMPT_ENABLED: "true"
      # R8 exceeded the default 4 GiB heap while packaging v1.2.5-rc.2.
      # Keep the larger heap scoped to the direct-download APK build.
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"'

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: bash scripts/ci/setup-android-sdk.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install repository-locked EAS CLI
        run: |
          set -euo pipefail
          npm ci --prefix tools/eas-cli --ignore-scripts --legacy-peer-deps
          tools/eas-cli/node_modules/.bin/eas --version

      - name: Apply resolved Android versionCode
        if: ${{ needs.preflight.outputs.version_code != '' }}
        env:
          REQUESTED_VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          ALLOW_UNTRACKED_VERSION_CODE: ${{ (contains(inputs.tag || github.event.inputs.tag || github.ref_name, '-') || inputs.internal_test_release || inputs.play_track != 'production') && 'true' || 'false' }}
          WRITE_APP_JSON: "1"
        run: node scripts/ci/android-version-code-policy.js

      - name: Build Android APK (local EAS)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          VERSION=${{ needs.preflight.outputs.version }}
          cd apps/mobile
          MINDWTR_ANDROID_ARCHS=arm64-v8a,armeabi-v7a "$GITHUB_WORKSPACE/tools/eas-cli/node_modules/.bin/eas" build --platform android --profile production-apk --local --non-interactive --output ./build/mindwtr-${VERSION}.apk
          ls -la ./build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANALYTICS_HEARTBEAT_URL: ${{ secrets.ANALYTICS_HEARTBEAT_URL }}
          # This APK is attached to the GitHub release and installed directly.
          ANALYTICS_HEARTBEAT_CHANNEL: android-direct
          ANALYTICS_RELEASE_VERSION: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          FEEDBACK_ENDPOINT_URL: ${{ vars.FEEDBACK_ENDPOINT_URL || vars.VITE_FEEDBACK_ENDPOINT_URL || 'https://feedback.mindwtr.app' }}

      - name: Verify 16 KB native library alignment
        run: |
          VERSION=${{ needs.preflight.outputs.version }}
          bash scripts/ci/check-android-16kb-page-size.sh "apps/mobile/build/mindwtr-${VERSION}.apk"

      - name: Collect Android release artifacts
        run: |
          set -euo pipefail
          VERSION=${{ needs.preflight.outputs.version }}
          APK_PATH="apps/mobile/build/mindwtr-${VERSION}.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "Missing APK artifact: ${APK_PATH}" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${APK_PATH}" "release-artifacts/mindwtr-${VERSION}.apk"
          ls -la release-artifacts

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-android
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 28

  publish:
    if: ${{ always() && needs.preflight.result == 'success' && needs.build-aab.result == 'success' && needs.preflight.outputs.play_tracks != 'none' && ((inputs.internal_test_release && needs.build-apk.result == 'skipped') || (!inputs.internal_test_release && needs.build-apk.result == 'success')) && (needs.preflight.outputs.publishes_production != 'true' || needs.preflight.outputs.stable_production_tag == 'true') }}
    needs: [preflight, build-aab, build-apk]
    runs-on: ubuntu-latest
    name: Android Publish
    timeout-minutes: 30
    concurrency:
      # Play edits are app-wide, including beta/internal and read-only lookups.
      group: google-play-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref }}

      - name: Authenticate Google Play API
        id: play_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Download Android AAB artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          mkdir -p apps/mobile/build
          gh run download "$GITHUB_RUN_ID" -n android-aab-build -D "$download_dir"
          find "$download_dir" -type f -name '*.aab' -print -exec cp {} apps/mobile/build/ \;
          if ! find apps/mobile/build -maxdepth 1 -name '*.aab' -print -quit | grep -q .; then
            echo "Downloaded android-aab-build artifact did not contain an AAB." >&2
            exit 1
          fi
          ls -la apps/mobile/build

      - name: Prepare Google Play release notes
        if: ${{ needs.preflight.outputs.publishes_production == 'true' }}
        run: |
          set -euo pipefail
          VERSION=${{ needs.preflight.outputs.version }}
          NOTES_FILE="docs/release-notes/google-play/${VERSION}.txt"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing release notes file: $NOTES_FILE" >&2
            exit 1
          fi
          OUT_DIR="apps/mobile/build/play-release-notes"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          awk -v out="$OUT_DIR" '
            /^<[^/>]+>$/ {
              tag=$0
              gsub(/[<>]/, "", tag)
              file=out "/whatsnew-" tag
              next
            }
            /^<\/[^>]+>$/ {
              tag=""
              next
            }
            tag != "" { print >> file }
          ' "$NOTES_FILE"
          python3 - "$OUT_DIR" "$NOTES_FILE" <<'PY'
          import pathlib
          import sys

          notes_dir = pathlib.Path(sys.argv[1])
          notes_file = sys.argv[2]
          limit = 500
          required_locales = {"en-US", "de-DE", "es-ES", "fr-FR", "zh-CN"}
          violations = []
          found_locales = set()

          for path in sorted(notes_dir.glob("whatsnew-*")):
              locale = path.name.replace("whatsnew-", "", 1)
              found_locales.add(locale)
              text = path.read_text(encoding="utf-8").strip()
              length = len(text)
              print(f"{path.name}: {length}/{limit}")
              if length > limit:
                  violations.append((locale, length))

          missing = sorted(required_locales - found_locales)
          if missing:
              raise SystemExit(
                  f"Google Play release notes missing required locales: {', '.join(missing)}. "
                  f"Update {notes_file} before publishing."
              )

          if violations:
              formatted = ", ".join(f"{locale}={length}" for locale, length in violations)
              raise SystemExit(
                  f"Google Play release notes exceed {limit} characters: {formatted}. "
                  f"Shorten {notes_file} before publishing."
              )
          PY
          ls -la "$OUT_DIR"

      - name: Prepare Google Play listing assets
        if: ${{ needs.preflight.outputs.publishes_production == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/prepare-google-play-listing-assets.py \
            apps/mobile/screenshots/android/playstore \
            apps/mobile/build/play-listing-assets.json
          cat apps/mobile/build/play-listing-assets.json

      - name: Prepare Google Play listing metadata
        if: ${{ needs.preflight.outputs.publishes_production == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/prepare-google-play-listing-metadata.py \
            metadata \
            apps/mobile/build/play-listing-metadata.json
          cat apps/mobile/build/play-listing-metadata.json

      - name: Publish to Google Play Store (Production)
        if: ${{ needs.preflight.outputs.publishes_production == 'true' && needs.preflight.outputs.stable_production_tag == 'true' }}
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          PLAY_TRACKS: ${{ needs.preflight.outputs.play_tracks }}
          ROLLOUT_MODE: ${{ needs.preflight.outputs.rollout_mode }}
          ROLLOUT_PERCENTAGE: ${{ needs.preflight.outputs.rollout_percentage }}
        run: |
          set -euo pipefail
          PACKAGE="tech.dongdongbh.mindwtr"
          VERSION="${{ needs.preflight.outputs.version }}"
          EXPECTED_VERSION_CODE="${{ needs.preflight.outputs.version_code }}"
          AAB_PATH="apps/mobile/build/mindwtr-${VERSION}.aab"
          NOTES_DIR="apps/mobile/build/play-release-notes"
          LISTING_ASSETS_FILE="apps/mobile/build/play-listing-assets.json"
          LISTING_METADATA_FILE="apps/mobile/build/play-listing-metadata.json"
          PLAN_FILE=$(mktemp)
          RESULT_FILE=$(mktemp)

          python3 scripts/ci/android-play-release-plan.py create-plan \
            --output "$PLAN_FILE" \
            --package "$PACKAGE" \
            --artifact "$AAB_PATH" \
            --expected-version-code "$EXPECTED_VERSION_CODE" \
            --version "$VERSION" \
            --tracks "$PLAY_TRACKS" \
            --stable-production \
            --rollout-mode "$ROLLOUT_MODE" \
            --rollout-percentage "$ROLLOUT_PERCENTAGE" \
            --stable-release-notes-directory "$NOTES_DIR" \
            --listing-assets-file "$LISTING_ASSETS_FILE" \
            --listings-file "$LISTING_METADATA_FILE"

          python3 scripts/ci/google-play-edit.py publish \
            --plan "$PLAN_FILE" \
            --result "$RESULT_FILE"
          VERSION_CODE=$(jq -er '.versionCode | numbers' "$RESULT_FILE")
          TRACK_LIST=$(jq -er '.tracks | join(",")' "$RESULT_FILE")
          echo "Published one standard AAB at versionCode $VERSION_CODE to Google Play tracks: $TRACK_LIST."
          {
            echo "### Google Play publication"
            echo
            if [ "$ROLLOUT_MODE" = "staged" ]; then
              echo "Started production versionCode \`$VERSION_CODE\` at \`${ROLLOUT_PERCENTAGE}%\`; beta and internal completed in the same Play edit."
            else
              echo "Completed production, beta, and internal for versionCode \`$VERSION_CODE\` in one Play edit."
            fi
            echo
            echo "Use \`.github/workflows/rollout.yml\` to inspect, increase, halt, resume, or finalize the production rollout."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Google Play testing tracks
        if: ${{ needs.preflight.outputs.publishes_production != 'true' && needs.preflight.outputs.play_tracks != 'none' }}
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          PLAY_TRACKS: ${{ needs.preflight.outputs.play_tracks }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          PACKAGE="tech.dongdongbh.mindwtr"
          VERSION="${{ needs.preflight.outputs.version }}"
          EXPECTED_VERSION_CODE="${{ needs.preflight.outputs.version_code }}"
          AAB_PATH="apps/mobile/build/mindwtr-${VERSION}.aab"
          PLAN_FILE=$(mktemp)
          RESULT_FILE=$(mktemp)

          python3 scripts/ci/android-play-release-plan.py create-plan \
            --output "$PLAN_FILE" \
            --package "$PACKAGE" \
            --artifact "$AAB_PATH" \
            --expected-version-code "$EXPECTED_VERSION_CODE" \
            --version "$VERSION" \
            --tracks "$PLAY_TRACKS" \
            --testing-release-notes "$RELEASE_NOTES"

          python3 scripts/ci/google-play-edit.py publish \
            --plan "$PLAN_FILE" \
            --result "$RESULT_FILE"
          VERSION_CODE=$(jq -er '.versionCode | numbers' "$RESULT_FILE")
          TRACK_LIST=$(jq -er '.tracks | join(",")' "$RESULT_FILE")
          echo "Published one standard AAB at versionCode $VERSION_CODE to Google Play testing tracks: $TRACK_LIST."
          {
            echo "### Google Play publication"
            echo
            echo "Published one standard AAB with versionCode \`$VERSION_CODE\` to \`$TRACK_LIST\` in one Play edit."
          } >> "$GITHUB_STEP_SUMMARY"
