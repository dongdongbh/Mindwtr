name: Publish reviewed AUR proposal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Mindwtr release tag whose saved AUR proposal should be published"
        required: true
        type: string
      package:
        description: "Official AUR package to publish"
        required: true
        type: choice
        options:
          - mindwtr-beta-bin
          - mindwtr-bin
          - mindwtr

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish ${{ inputs.package }} after review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aur-publish
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid stable or RC tag: $RELEASE_TAG" >&2
            exit 1
          fi
          case "$PACKAGE_NAME" in
            mindwtr|mindwtr-bin|mindwtr-beta-bin) ;;
            *) echo "Unsupported AUR package: $PACKAGE_NAME" >&2; exit 1 ;;
          esac

      - name: Checkout security policy and validators
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Find the saved proposal artifact
        id: proposal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="aur-proposal-${PACKAGE_NAME}-${RELEASE_TAG}"
          RESPONSE="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100")"
          RUN_ID="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty' <<< "$RESPONSE")"
          if [ -z "$RUN_ID" ]; then
            echo "No unexpired reviewed proposal named ${ARTIFACT_NAME}. Regenerate it from the existing tag first." >&2
            exit 1
          fi
          RUN_META="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          SOURCE_REPO="$(jq -r '.head_repository.full_name // empty' <<< "$RUN_META")"
          SOURCE_EVENT="$(jq -r '.event // empty' <<< "$RUN_META")"
          SOURCE_WORKFLOW="$(jq -r '.path // empty' <<< "$RUN_META")"
          if [ "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Proposal artifact came from an untrusted repository: ${SOURCE_REPO:-missing}" >&2
            exit 1
          fi
          case "$SOURCE_EVENT" in
            push|workflow_dispatch) ;;
            *) echo "Proposal artifact came from an untrusted event: ${SOURCE_EVENT:-missing}" >&2; exit 1 ;;
          esac
          case "$SOURCE_WORKFLOW" in
            .github/workflows/release.yml|.github/workflows/release-rc.yml|.github/workflows/update-aur-beta.yml) ;;
            *) echo "Proposal artifact came from an untrusted workflow: ${SOURCE_WORKFLOW:-missing}" >&2; exit 1 ;;
          esac
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using proposal artifact ${ARTIFACT_NAME} from trusted run ${RUN_ID}."

      - name: Download reviewed proposal
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ steps.proposal.outputs.artifact_name }}
          path: proposal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.proposal.outputs.run_id }}

      - name: Verify proposal identity and review checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          set -euo pipefail
          test "$(cat proposal/package-name)" = "$PACKAGE_NAME"
          test "$(cat proposal/release-tag)" = "$RELEASE_TAG"
          (
            cd proposal
            sha256sum --check proposal-manifest.sha256
            sha256sum --check review.patch.sha256
          )

      - name: Confirm all AUR owners and histories are unchanged
        shell: bash
        run: node scripts/ci/audit-aur-state.mjs --compare proposal/aur-security-snapshot.json

      - name: Configure dedicated AUR SSH credential
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "The aur-publish environment does not provide AUR_SSH_PRIVATE_KEY." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
          EOF
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur-known-hosts" 2>/dev/null
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$RUNNER_TEMP/aur-known-hosts" -E sha256 | awk '{print $2}')"
          EXPECTED_FINGERPRINT='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "AUR SSH host fingerprint mismatch: expected ${EXPECTED_FINGERPRINT}, got ${ACTUAL_FINGERPRINT:-missing}." >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/aur-known-hosts" ~/.ssh/known_hosts

      - name: Re-fetch target package and apply the reviewed proposal
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          set -euo pipefail
          git clone "ssh://aur@aur.archlinux.org/${PACKAGE_NAME}.git" aur-live
          EXPECTED_BASE="$(cat proposal/base-commit)"
          ACTUAL_BASE="$(git -C aur-live rev-parse HEAD)"
          if [ "$ACTUAL_BASE" != "$EXPECTED_BASE" ]; then
            echo "AUR history changed after review: expected ${EXPECTED_BASE}, got ${ACTUAL_BASE}." >&2
            exit 1
          fi

          install -m 0644 proposal/PKGBUILD aur-live/PKGBUILD
          install -m 0644 proposal/.SRCINFO aur-live/.SRCINFO
          if [ "$PACKAGE_NAME" = "mindwtr" ]; then
            test -f proposal/pnpm-lock.yaml
            test -f proposal/pnpm-workspace.yaml
            install -m 0644 proposal/pnpm-lock.yaml aur-live/pnpm-lock.yaml
            install -m 0644 proposal/pnpm-workspace.yaml aur-live/pnpm-workspace.yaml
            git -C aur-live add -N -f -- pnpm-lock.yaml pnpm-workspace.yaml
          fi
          if [ -f proposal/tauri-v2-schema.patch ]; then
            install -m 0644 proposal/tauri-v2-schema.patch aur-live/tauri-v2-schema.patch
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ "$file" != "tauri-v2-schema.patch" ] && [ "$file" != "bun.lock" ]; then
              echo "Proposal requested an unauthorized deletion: $file" >&2
              exit 1
            fi
            rm -f "aur-live/$file"
          done < proposal/delete-files.txt

          node scripts/ci/validate-aur-package.mjs \
            --package-dir aur-live \
            --package "$PACKAGE_NAME"

          cp aur-live/.SRCINFO "$RUNNER_TEMP/reviewed.SRCINFO"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -v "$PWD/aur-live:/aur" \
            -w /aur \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed base-devel
              getent group "$HOST_GID" >/dev/null 2>&1 || groupadd -g "$HOST_GID" builder
              id -u builder >/dev/null 2>&1 || useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              chown -R builder:builder /aur
              su builder -c "makepkg --printsrcinfo" > /aur/.SRCINFO.generated
            '
          if ! cmp -s "$RUNNER_TEMP/reviewed.SRCINFO" aur-live/.SRCINFO.generated; then
            echo "Reviewed .SRCINFO does not exactly match PKGBUILD." >&2
            diff -u "$RUNNER_TEMP/reviewed.SRCINFO" aur-live/.SRCINFO.generated || true
            exit 1
          fi
          rm aur-live/.SRCINFO.generated
          git -C aur-live diff --binary -- PKGBUILD .SRCINFO pnpm-lock.yaml pnpm-workspace.yaml tauri-v2-schema.patch bun.lock > actual-review.patch
          if ! cmp -s proposal/review.patch actual-review.patch; then
            echo "Applied AUR diff does not match the manually reviewed proposal." >&2
            diff -u proposal/review.patch actual-review.patch || true
            exit 1
          fi

      - name: Commit and publish without force-push
        id: publish
        shell: bash
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          PACKAGE_NAME: ${{ inputs.package }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$(git -C aur-live status --porcelain -- PKGBUILD .SRCINFO pnpm-lock.yaml pnpm-workspace.yaml tauri-v2-schema.patch bun.lock)" ]; then
            echo "AUR package already matches the reviewed proposal."
            echo "status=already-current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C aur-live config user.name "${AUR_USERNAME:-mindwtr-bot}"
          git -C aur-live config user.email "${AUR_EMAIL:-actions@github.com}"
          git -C aur-live add PKGBUILD .SRCINFO
          git -C aur-live add -f -- pnpm-lock.yaml pnpm-workspace.yaml
          if git -C aur-live ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            git -C aur-live add -u -- bun.lock
          fi
          if git -C aur-live ls-files --error-unmatch tauri-v2-schema.patch >/dev/null 2>&1; then
            git -C aur-live add -u -- tauri-v2-schema.patch
          fi
          if [ -e aur-live/tauri-v2-schema.patch ]; then
            git -C aur-live add -- tauri-v2-schema.patch
          fi
          git -C aur-live commit -m "Update to ${RELEASE_TAG}"

          PUSH_LOG="$RUNNER_TEMP/aur-push.log"
          if git -C aur-live push origin HEAD:master 2>&1 | tee "$PUSH_LOG"; then
            echo "status=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eqi 'AUR is down due to maintenance|disabled (all )?AUR pushes|pushes (are|have been) disabled' "$PUSH_LOG"; then
            echo "::warning::AUR publication delayed by Arch maintenance/security controls. The reviewed proposal artifact remains unchanged for a later dispatch."
            echo "status=delayed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "AUR rejected the reviewed proposal for an unexpected reason." >&2
          exit 1

      - name: Summarize publication state
        shell: bash
        env:
          STATUS: ${{ steps.publish.outputs.status }}
          PACKAGE_NAME: ${{ inputs.package }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## AUR publication"
            echo
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- Status: **${STATUS}**"
          } >> "$GITHUB_STEP_SUMMARY"
