name: Docker Image (MCP)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to the selected branch)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-mcp-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: dongdongbh/mindwtr-mcp

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve MCP image identity
        id: identity
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/mcp-server/package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable MCP package version, got: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Automatic publication requires a stable release tag.' >&2
            exit 1
          fi
          printf 'version=%s\nrevision=%s\nimage=ghcr.io/%s:%s\n' \
            "$VERSION" "$(git rev-parse HEAD)" "$IMAGE_NAME" "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check immutable MCP version tag
        id: existing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          TOKEN=$(curl --fail --silent --show-error \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_NAME}:pull,push" \
            | jq -er '.token | select(type == "string" and length > 0)')
          STATUS=$(curl --silent --show-error --output "$RUNNER_TEMP/mcp-manifest.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $TOKEN" \
            --header 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${MCP_VERSION}")
          case "$STATUS" in
            200)
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo "ghcr.io/${IMAGE_NAME}:${MCP_VERSION} already exists; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Cannot establish whether the MCP version exists (HTTP $STATUS); refusing publication." >&2
              exit 1
              ;;
          esac

      - name: Set up Bun
        if: steps.existing.outputs.exists != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install smoke test dependencies
        if: steps.existing.outputs.exists != 'true'
        run: bun install --frozen-lockfile

      - name: Set up QEMU
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build amd64 smoke image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/mcp/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mindwtr-mcp:smoke-amd64
          build-args: |
            MCP_VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ steps.identity.outputs.revision }}
          cache-from: type=gha,scope=mcp-amd64
          cache-to: type=gha,mode=min,scope=mcp-amd64

      - name: Smoke test amd64 image
        if: steps.existing.outputs.exists != 'true'
        run: node scripts/ci/smoke-mcp-container.mjs mindwtr-mcp:smoke-amd64

      - name: Build arm64 smoke image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/mcp/Dockerfile
          platforms: linux/arm64
          load: true
          tags: mindwtr-mcp:smoke-arm64
          build-args: |
            MCP_VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ steps.identity.outputs.revision }}
          cache-from: type=gha,scope=mcp-arm64
          cache-to: type=gha,mode=min,scope=mcp-arm64

      - name: Smoke test arm64 image
        if: steps.existing.outputs.exists != 'true'
        run: node scripts/ci/smoke-mcp-container.mjs mindwtr-mcp:smoke-arm64

      - name: Log in to GHCR
        if: steps.existing.outputs.exists != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested multi-platform image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: |
            MCP_VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ steps.identity.outputs.revision }}
          cache-from: |
            type=gha,scope=mcp-amd64
            type=gha,scope=mcp-arm64
