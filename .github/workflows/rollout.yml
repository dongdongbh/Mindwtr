name: Manage Store Rollout

on:
  schedule:

    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: Production store to manage (Apple uses App Store Connect)
        required: true
        type: choice
        options: [play, msstore]
      action:
        description: Operation on the existing release (resume is Play only)
        required: true
        type: choice
        options: [status, increase, halt, resume, finalize]
        default: status
      version_code:
        description: Exact Play production versionCode (required for Play)
        type: string
      submission_id:
        description: Exact published production submission ID (required for Microsoft)
        type: string
      percentage:
        description: New percentage for increase only (greater than current, less than 100); use finalize for 100%
        type: number
        default: 20

permissions:
  contents: read

jobs:
  promotion-gate:
    if: github.repository == 'dongdongbh/Mindwtr'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.age.outputs.ready }}
    steps:
      - name: Keep a fresh stable release at 5% for its first day
        id: age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          newest_stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[] | .ref | select(test("^refs/tags/v[0-9]+[.][0-9]+[.][0-9]+$")) | ltrimstr("refs/tags/")' | sort -V | tail -n 1)"
          if [ "$published_tag" != "$newest_stable_tag" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Stable tag $newest_stable_tag has not published its release; keeping store rollouts unchanged."
            exit 0
          fi
          published_at="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .published_at)"
          published_epoch="$(date -u -d "$published_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - published_epoch))"
          if [ "$age_seconds" -lt 0 ]; then
            echo "Latest stable release has a future publication time: $published_at" >&2
            exit 1
          fi
          if [ "$age_seconds" -lt 86400 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Latest stable release is ${age_seconds}s old; keeping store rollouts at 5%."
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

  play:

    needs: promotion-gate
    if: always() && github.repository == 'dongdongbh/Mindwtr' && needs.promotion-gate.result == 'success' && (github.event_name != 'schedule' || needs.promotion-gate.outputs.ready == 'true') && (github.event_name == 'schedule' || inputs.store == 'play')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: google-play-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Authenticate Google Play API
        id: play_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Manage existing Play production release
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          ROLLOUT_ACTION: ${{ github.event_name == 'schedule' && 'auto' || inputs.action }}
          VERSION_CODE: ${{ inputs.version_code }}
          ROLLOUT_PERCENTAGE: ${{ inputs.percentage }}
        run: |
          set -euo pipefail
          if [ "$ROLLOUT_ACTION" = auto ]; then
            args=(auto-rollout --package tech.dongdongbh.mindwtr)
          else
            args=(rollout --package tech.dongdongbh.mindwtr --action "$ROLLOUT_ACTION")
            if [ -n "$VERSION_CODE" ]; then
              args+=(--version-code "$VERSION_CODE")
            fi
            if [ "$ROLLOUT_ACTION" = increase ]; then
              args+=(--percentage "$ROLLOUT_PERCENTAGE")
            fi
          fi
          python3 scripts/ci/google-play-edit.py "${args[@]}" --result "$RUNNER_TEMP/play-rollout.json"
          if [ "$ROLLOUT_ACTION" = status ]; then
            python3 scripts/ci/google-play-edit.py max-version-code --package tech.dongdongbh.mindwtr --result "$RUNNER_TEMP/play-maximum.json"
          fi
          {
            echo '### Google Play production rollout'
            echo '```json'
            cat "$RUNNER_TEMP/play-rollout.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  msstore:
    needs: promotion-gate
    if: always() && github.repository == 'dongdongbh/Mindwtr' && needs.promotion-gate.result == 'success' && (github.event_name != 'schedule' || needs.promotion-gate.outputs.ready == 'true') && (github.event_name == 'schedule' || inputs.store == 'msstore')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: msstore-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Manage existing Microsoft production submission
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID || '9N0V5B0B6FRX' }}
          ROLLOUT_ACTION: ${{ github.event_name == 'schedule' && 'auto' || inputs.action }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          ROLLOUT_PERCENTAGE: ${{ inputs.percentage }}
        run: |
          set -euo pipefail
          if [ "$ROLLOUT_ACTION" = auto ]; then
            args=(--action auto)
          elif [ "$ROLLOUT_ACTION" = status ] && [ -z "$SUBMISSION_ID" ]; then
            args=(--action status)
          else
            args=(--submission-id "$SUBMISSION_ID" --action "$ROLLOUT_ACTION")
            if [ "$ROLLOUT_ACTION" = increase ]; then
              args+=(--percentage "$ROLLOUT_PERCENTAGE")
            fi
          fi
          node scripts/ci/msstore-rollout.mjs "${args[@]}"
