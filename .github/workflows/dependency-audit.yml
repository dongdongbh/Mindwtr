name: Dependency Audit

on:
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "**/package-lock.json"
      - "apps/*/package.json"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "scripts/ci/validate-dependency-audit.test.js"
      - "scripts/ci/validate-mobile-npm-audit.js"
      - "scripts/ci/validate-npm-audit.js"
      - "scripts/ci/audit-build-tool-topology.json"
      - "scripts/ci/check-audit-exception-upstreams.js"
      - "tools/eas-cli/package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "**/package-lock.json"
      - "apps/*/package.json"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "scripts/ci/validate-dependency-audit.test.js"
      - "scripts/ci/validate-mobile-npm-audit.js"
      - "scripts/ci/validate-npm-audit.js"
      - "scripts/ci/audit-build-tool-topology.json"
      - "scripts/ci/check-audit-exception-upstreams.js"
      - "tools/eas-cli/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Bun audit exceptions
        run: bun test scripts/ci/validate-dependency-audit.test.js

      - name: Audit Bun dependencies
        run: |
          set -euo pipefail











          if ! bun audit \
            --ignore=GHSA-5p2g-fcmc-qvqq \
            --ignore=GHSA-w3rx-r6r6-pgpr \
            --ignore=GHSA-gcqx-w48m-w2h4 \
            --ignore=GHSA-3g3m-2fjr-6pw4 \
            --ignore=GHSA-g3hv-75wg-m249; then
            echo "bun audit reported vulnerabilities or failed." >&2
            exit 1
          fi

      - name: Audit shipped npm package locks
        run: |
          set -euo pipefail
          desktop_audit_report="$RUNNER_TEMP/desktop-npm-audit.json"
          if ! npm audit --prefix apps/desktop --audit-level=low --json > "$desktop_audit_report"; then
            bun scripts/ci/validate-npm-audit.js "$desktop_audit_report" desktop
          fi
          mobile_audit_report="$RUNNER_TEMP/mobile-npm-audit.json"
          if ! npm audit --prefix apps/mobile --audit-level=low --json > "$mobile_audit_report"; then


            bun scripts/ci/validate-mobile-npm-audit.js "$mobile_audit_report"
          fi
          npm audit --prefix packages/core --audit-level=low
          eas_audit_report="$RUNNER_TEMP/eas-npm-audit.json"
          if ! npm audit --prefix tools/eas-cli --audit-level=low --json > "$eas_audit_report"; then
            bun scripts/ci/validate-npm-audit.js "$eas_audit_report" eas
          fi

      - name: Check upstream fixes for audit exceptions
        if: always()
        run: |
          set -euo pipefail
          deepmerge_latest="$(npm view deepmerge version)"
          if [ "$deepmerge_latest" != "4.3.1" ]; then
            echo "deepmerge $deepmerge_latest is released: check GHSA-gcqx-w48m-w2h4 and drop its audit exception." >&2
            exit 1
          fi
          bun scripts/ci/check-audit-exception-upstreams.js

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Assert locked rkyv is unreachable
        run: |
          set -euo pipefail
          tree_output="$RUNNER_TEMP/rkyv-feature-tree.txt"
          if ! cargo tree --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target all \
            --edges all \
            --invert rkyv \
            > "$tree_output"; then
            echo "Failed to determine whether rkyv is active." >&2
            exit 1
          fi
          if [ -s "$tree_output" ]; then
            echo "rkyv entered the active desktop feature graph; remove the audit ignore and update the dependency chain." >&2
            cat "$tree_output" >&2
            exit 1
          fi

      - name: Audit Rust dependencies
        run: |
          set -euo pipefail




















          if ! cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2023-0086 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372 \
            --file apps/desktop/src-tauri/Cargo.lock; then
            echo "cargo audit reported vulnerabilities or warnings, or failed." >&2
            exit 1
          fi
