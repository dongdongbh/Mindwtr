name: Dependency Audit

on:
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "**/package-lock.json"
      - "apps/*/package.json"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "scripts/ci/validate-dependency-audit.test.js"
      - "scripts/ci/validate-mobile-npm-audit.js"
      - "scripts/ci/validate-npm-audit.js"
      - "scripts/ci/audit-build-tool-topology.json"
      - "tools/eas-cli/package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "**/package-lock.json"
      - "apps/*/package.json"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "scripts/ci/validate-dependency-audit.test.js"
      - "scripts/ci/validate-mobile-npm-audit.js"
      - "scripts/ci/validate-npm-audit.js"
      - "scripts/ci/audit-build-tool-topology.json"
      - "tools/eas-cli/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Bun audit exceptions
        run: bun test scripts/ci/validate-dependency-audit.test.js

      - name: Audit Bun dependencies
        run: |
          set -euo pipefail
          # Temporary build-tool exceptions, pinned by the preceding governance test:
          # - image-size 1.2.1: Metro asset inspection; patched 2.x needs bundling validation.
          # - braces 3.0.3: Tailwind/Metro/Jest file globs; no patched release exists.
          # - node-forge 1.4.0: Expo development/build code signing; no patched release exists.
          # None is imported by the shipped app, core, cloud, or MCP runtime source.
          # Exact ancestor versions/edges and runtime import checks fail on new exposure.
          # Signing tools DO call verification APIs; this is a build-tool exception,
          # not a claim that their vulnerable code cannot execute. Remove each exception
          # once an upstream patch or validated dependency migration is available.
          if ! bun audit \
            --ignore=GHSA-5p2g-fcmc-qvqq \
            --ignore=GHSA-w3rx-r6r6-pgpr \
            --ignore=GHSA-vfj7-8cjw-p6xm \
            --ignore=GHSA-86w9-cpqp-85rv; then
            echo "bun audit reported vulnerabilities or failed." >&2
            exit 1
          fi

      - name: Audit shipped npm package locks
        run: |
          set -euo pipefail
          desktop_audit_report="$RUNNER_TEMP/desktop-npm-audit.json"
          if ! npm audit --prefix apps/desktop --audit-level=low --json > "$desktop_audit_report"; then
            bun scripts/ci/validate-npm-audit.js "$desktop_audit_report" desktop
          fi
          mobile_audit_report="$RUNNER_TEMP/mobile-npm-audit.json"
          if ! npm audit --prefix apps/mobile --audit-level=low --json > "$mobile_audit_report"; then
            # Validate exact advisory/package/version sets and reviewed lock topology.
            # New advisories, consumers, malformed reports, and audit API errors fail.
            bun scripts/ci/validate-mobile-npm-audit.js "$mobile_audit_report"
          fi
          npm audit --prefix packages/core --audit-level=low
          eas_audit_report="$RUNNER_TEMP/eas-npm-audit.json"
          if ! npm audit --prefix tools/eas-cli --audit-level=low --json > "$eas_audit_report"; then
            bun scripts/ci/validate-npm-audit.js "$eas_audit_report" eas
          fi

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Assert locked rkyv is unreachable
        run: |
          set -euo pipefail
          tree_output="$RUNNER_TEMP/rkyv-feature-tree.txt"
          if ! cargo tree --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target all \
            --edges all \
            --invert rkyv \
            > "$tree_output"; then
            echo "Failed to determine whether rkyv is active." >&2
            exit 1
          fi
          if [ -s "$tree_output" ]; then
            echo "rkyv entered the active desktop feature graph; remove the audit ignore and update the dependency chain." >&2
            cat "$tree_output" >&2
            exit 1
          fi

      - name: Audit Rust dependencies
        run: |
          set -euo pipefail
          # Temporary ignores:
          # - RUSTSEC-2026-0235: Cargo.lock contains rkyv 0.7 through the
          #   optional rust_decimal metadata recorded under byte-unit. The
          #   preceding all-target feature-tree assertion proves no active
          #   normal/build/dev edge enables rkyv; fail that assertion instead
          #   of carrying this ignore if the feature graph changes.
          # - RUSTSEC-2026-0097: rand advisory only reachable through upstream
          #   Tauri/wry transitive dependencies.
          # - RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml DoS advisories.
          #   The only remaining <0.41 copy comes from wayland-scanner (build-time
          #   codegen over bundled Wayland protocol XML, no untrusted input);
          #   drop these once wayland-rs moves to quick-xml >=0.41.
          # - RUSTSEC-2023-0086: lexical-core 0.7 soundness advisory, pinned by
          #   nom 5 under the imap crate (email capture). No compatible fix on
          #   nom 5; drop once imap releases a stable on nom >=7.
          # - RUSTSEC-2026-0370 / RUSTSEC-2026-0371 / RUSTSEC-2026-0372:
          #   zvariant, zbus_names and zvariant_derive unmaintained
          #   (informational, no patched version): merged into zbus 6. Pulled
          #   in by zbus 3 (keyring/secret-service) and zbus 5 (ashpd, oo7,
          #   notify-rust); drop once those move to zbus >=6.
          if ! cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2023-0086 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372 \
            --file apps/desktop/src-tauri/Cargo.lock; then
            echo "cargo audit reported vulnerabilities or warnings, or failed." >&2
            exit 1
          fi
