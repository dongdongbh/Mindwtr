name: Performance Baselines

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      VITE_STARTUP_PROFILING: '1'
      RUNS: '30'
      OUT_DIR: build/performance-web/ci
      DEVICE_LABEL: github-hosted-ubuntu-24.04-variable-hardware
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:perf-tools
      - run: bunx playwright install --with-deps chromium
      - run: bun run desktop:web:build
      - name: Measure sequential production UI runs (reporting, not a hosted timing gate)
        run: bun run perf:web
      - name: Retain measurements and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-browser-performance-${{ github.sha }}
          path: build/performance-web/ci
          retention-days: 90
          if-no-files-found: warn
