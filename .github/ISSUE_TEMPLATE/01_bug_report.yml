name: "\U0001F41B Bug Report"
description: Create a report to help us improve Mindwtr
title: "[BUG] "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        If this is mainly a sync or data problem, the **Sync / Data Issue** form gets it triaged faster.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - "Desktop (Linux)"
        - "Desktop (macOS)"
        - "Desktop (Windows)"
        - "Mobile (Android)"
        - "Mobile (iOS)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - "Sync / data consistency"
        - "UI / interaction"
        - "Projects / areas / sections"
        - "Search / filter"
        - "Settings / preferences"
        - "Notifications / reminders"
        - "Recurrence / calendar"
        - "Attachments"
        - "Audio / transcription"
        - "Other"
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About. A commit hash is fine for a source build.
      placeholder: v1.3.1
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Install channel
      multiple: true
      options:
        - "Play Store"
        - "F-Droid"
        - "App Store (iOS)"
        - "TestFlight"
        - "Mac App Store"
        - "Microsoft Store"
        - "winget"
        - "Homebrew"
        - "Flathub"
        - "APT"
        - "AUR"
        - "Nix (community flake)"
        - "Distro package"
        - "Release file (.deb / .rpm / AppImage / .dmg / .exe / .msi / APK)"
        - "Source / dev build"
        - "Other"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: Android 15, Windows 11, Arch Linux (Hyprland)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Only for mobile.
      placeholder: Pixel 8
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      multiple: true
      options:
        - "Blocks core workflow"
        - "Data loss or data mismatch"
        - "Crash / freeze"
        - "Visual issue only"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: regression
    attributes:
      label: Last version where this worked
      description: Leave empty if it never worked or you do not know.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, logs
      description: |
        Screenshots, a short recording, or logs. Drag files into the box to attach them.

        **Logs:** go to **Settings → Data → Diagnostics**, turn on **Debug logging**, reproduce the issue, then attach the log: **Share log** on mobile, **Save log** on desktop (v1.3.2 and later; on older versions attach the file shown at **Log file**). Logs stay on your device and redact common credentials. Details: https://docs.mindwtr.app/data-sync/diagnostics-logs

        **Recording without your private tasks:** **Settings → Data → Open sandbox**, then **Enter sandbox**. It loads fictional tasks; leave it from the sandbox banner. Sample data may not reproduce a bug that involves your own data, attachments or sync.
  - type: textarea
    id: context
    attributes:
      label: Additional context
