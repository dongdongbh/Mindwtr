name: "💥 Internal app error"
description: Report an in-app error dialog or pop-up with a stack trace or diagnostic ID
title: "[APP-ERROR] "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Please include diagnostics logs with your bug report.** Logs are especially important for sync, reminders, crashes, and problems we cannot reproduce. They help us identify what happened and avoid a round of follow-up questions.

        In **Settings → Data → Diagnostics**, enable **Debug logging**, reproduce the problem if safe, then use **Share log** (mobile) or **Save log** (desktop). Attach the exported file below. If you cannot collect logs, explain why in the diagnostics field; you can still submit the report.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - "Desktop (Linux)"
        - "Desktop (macOS)"
        - "Desktop (Windows)"
        - "Mobile (Android)"
        - "Mobile (iOS)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.3.1
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Install channel
      multiple: true
      options:
        - "Play Store"
        - "F-Droid"
        - "App Store (iOS)"
        - "TestFlight"
        - "Mac App Store"
        - "Microsoft Store"
        - "winget"
        - "Homebrew"
        - "Flathub"
        - "APT"
        - "AUR"
        - "Nix (community flake)"
        - "Distro package"
        - "Release file (.deb / .rpm / AppImage / .dmg / .exe / .msi / APK)"
        - "Source / dev build"
        - "Other"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error details
      description: Paste the exact error text, stack trace, or diagnostics ID shown in the app.
      render: text
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: The action right before the error appeared.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      multiple: true
      options:
        - "Happened once"
        - "Happens sometimes"
        - "Happens every time"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics logs (strongly recommended)
      description: |
        Attach the log file by dragging it into this box. Include the approximate time of the problem and your timezone. For problems involving multiple devices, attach a log from each affected device and identify which is which.

        Logs stay on your device until you share them and redact common credentials. Review files before posting: GitHub issues are public. Do not attach a full task database or backup. Instructions: https://docs.mindwtr.app/data-sync/diagnostics-logs

        If logs are unavailable, explain why (for example, the app will not open). For a purely visual issue, a screenshot or recording plus a short explanation is fine.
      placeholder: Attach logs here, or explain why you cannot provide them.
    validations:
      required: true
