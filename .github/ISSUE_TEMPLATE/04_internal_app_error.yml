name: "💥 Internal app error"
description: Report an in-app error dialog or pop-up with a stack trace or diagnostic ID
title: "[APP-ERROR] "
labels: ["bug", "status:needs-triage"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - "Desktop (Linux)"
        - "Desktop (macOS)"
        - "Desktop (Windows)"
        - "Mobile (Android)"
        - "Mobile (iOS)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.3.1
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Install channel
      multiple: true
      options:
        - "Play Store"
        - "F-Droid"
        - "App Store (iOS)"
        - "TestFlight"
        - "Mac App Store"
        - "Microsoft Store"
        - "winget"
        - "Homebrew"
        - "Flathub"
        - "APT"
        - "AUR"
        - "Nix (community flake)"
        - "Distro package"
        - "Release file (.deb / .rpm / AppImage / .dmg / .exe / .msi / APK)"
        - "Source / dev build"
        - "Other"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error details
      description: Paste the exact error text, stack trace, or diagnostics ID shown in the app.
      render: text
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: The action right before the error appeared.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      multiple: true
      options:
        - "Happened once"
        - "Happens sometimes"
        - "Happens every time"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / attachments
      description: "Attach logs if you have them: https://docs.mindwtr.app/data-sync/diagnostics-logs"
