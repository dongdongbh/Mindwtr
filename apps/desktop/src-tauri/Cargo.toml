[package]
name = "mindwtr"
version = "1.3.8"
description = "A complete Getting Things Done (GTD) productivity system - Mind Like Water"
authors = ["DongDong"]
license = "AGPL-3.0-only"
repository = "https://github.com/dongdongbh/Mindwtr"
homepage = "https://mindwtr.app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.2"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }


toml = "0.8"


dunce = "1"
log = "0.4"
fs2 = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-global-shortcut = "2"


tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration", "unsafe-headers"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"


tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
dirs = "5"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "2"


reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
imap = "2.4"


native-tls = { version = "0.2", features = ["vendored"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
hound = "3.5"
whisper-rs = "0.16.0"
cpal = "0.15"
open = "5.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
bzip2 = "0.5"
rand = "0.8"
sha2 = "0.10"
notify = "8.2"
tempfile = "3.23"
tauri-plugin-autostart = "2.5.1"


tar = "0.4"


aes-gcm = "0.10.3"
argon2 = "0.5.3"


unicode-normalization = "0.1.25"
fontdb = "0.24.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Security_Credentials_UI", "Services_Store", "UI_Notifications", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }


reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.11"

oo7 = { version = "0.5", default-features = false, features = ["tokio", "native_crypto"] }
libloading = "0.8"
webkit2gtk = "2"

gtk = "0.18"
gdkx11 = "0.18"
zbus = { version = "=5.12.0", default-features = false, features = ["tokio"] }

[features]
default = []
diagnostics = ["tauri/devtools"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
