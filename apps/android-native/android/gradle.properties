# A fresh tree compiling debug, upgradetest and both benchmark variants ran out of memory at -Xmx3g.
# Gradle 6g + Kotlin daemon 4g stays inside a 16 GB GitHub ubuntu runner.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.code.style=official
