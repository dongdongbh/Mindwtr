# A fresh tree compiling debug, upgradetest and both benchmark variants needs about 6 GB (it ran out at -Xmx3g).
# The Kotlin compiler runs inside each build's own Gradle daemon: worktrees building at once used to share one
# Kotlin daemon and run out of its heap. 6 GB stays inside a 16 GB GitHub ubuntu runner.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
